name: UNO Party checks

on:
  push:
    branches:
      - feature/uno-party-mvp
  pull_request:
    branches:
      - main

jobs:
  uno-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check JavaScript syntax
        run: npm run check
      - name: Test UNO engine
        run: npm test
